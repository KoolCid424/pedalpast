<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f1ede3">

  <meta
    name="description"
    content="PedalPast. Private vintage bicycle experiences. Website coming soon."
  >

  <title>PedalPast | Coming Soon</title>

  <!-- FAVICON -->
  <link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/PvZWWyRx/transparent-logo.png"
  >

  <link
    rel="apple-touch-icon"
    href="https://i.ibb.co/PvZWWyRx/transparent-logo.png"
  >

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #f1ede3;
      color: #151513;

      font-family: "Inter", sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      overflow-x: hidden;
    }


    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {
      --cream: #f1ede3;
      --ink: #151513;
      --grey: #77736a;
      --orange: #d45d31;
      --line: rgba(21, 21, 19, 0.14);
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      position: relative;

      width: 100%;
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      padding:
        max(22px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));

      isolation: isolate;
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    .background {
      position: fixed;
      inset: 0;

      z-index: -1;

      pointer-events: none;

      overflow: hidden;
    }


    .grain {
      position: absolute;
      inset: 0;

      opacity: 0.045;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");

      mix-blend-mode: multiply;
    }


    .glow {
      position: absolute;

      width: 80vw;
      height: 80vw;

      right: -40vw;
      top: -25vw;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(212, 93, 49, 0.16),
          transparent 68%
        );

      filter: blur(20px);
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      animation:
        enterTop 0.8s cubic-bezier(.16,1,.3,1) both;
    }


    .logo {
      width: 74px;
      height: 74px;

      object-fit: contain;

      display: block;
    }


    .status {
      display: flex;
      align-items: center;

      gap: 7px;

      margin-top: 7px;

      font-family: "DM Mono", monospace;

      font-size: 8px;

      line-height: 1.2;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color: var(--grey);
    }


    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--orange);

      animation: breathe 2.4s ease-in-out infinite;
    }


    @keyframes breathe {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.7);
      }

    }


    /* =====================================================
       HERO
    ===================================================== */

    main {
      flex: 1;

      display: flex;
      align-items: center;

      padding:
        clamp(55px, 13vh, 115px)
        0
        clamp(45px, 10vh, 90px);
    }


    .hero {
      width: 100%;
    }


    .kicker {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 18px;

      font-family: "DM Mono", monospace;

      font-size: 9px;

      line-height: 1.2;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      color: var(--grey);

      animation:
        fadeUp 0.8s 0.12s cubic-bezier(.16,1,.3,1) both;
    }


    .kicker-line {
      width: 24px;
      height: 1px;

      background: var(--orange);
    }


    /* =====================================================
       HEADING
    ===================================================== */

    h1 {
      margin: 0;

      max-width: 100%;

      font-size:
        clamp(
          61px,
          18.5vw,
          108px
        );

      line-height: 0.84;

      letter-spacing: -0.09em;

      font-weight: 900;

      text-transform: uppercase;

      animation:
        titleReveal
        1.05s
        0.18s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    h1 .solid {
      display: block;
    }


    h1 .outline {
      display: block;

      color: transparent;

      -webkit-text-stroke:
        1.3px var(--ink);
    }


    /* =====================================================
       COPY
    ===================================================== */

    .copy {
      max-width: 390px;

      margin-top: 28px;

      font-size: 15px;

      line-height: 1.65;

      color: var(--grey);

      animation:
        fadeUp
        0.8s
        0.42s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    .copy strong {
      color: var(--ink);

      font-weight: 600;
    }


    /* =====================================================
       BOTTOM INFO
    ===================================================== */

    .bottom {
      animation:
        fadeUp
        0.8s
        0.62s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    .rule {
      width: 100%;
      height: 1px;

      margin-bottom: 15px;

      background: var(--line);
    }


    .bottom-row {
      display: flex;

      justify-content: space-between;
      align-items: flex-end;

      gap: 20px;
    }


    .descriptor {
      font-family: "DM Mono", monospace;

      font-size: 8px;

      line-height: 1.65;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color: var(--grey);
    }


    .year {
      font-family: "DM Mono", monospace;

      font-size: 8px;

      letter-spacing: 0.08em;

      color: var(--grey);
    }


    /* =====================================================
       DESKTOP ENHANCEMENT
       Mobile is the base design.
    ===================================================== */

    @media (min-width: 700px) {

      .page {
        padding:
          34px
          42px
          28px;
      }


      .logo {
        width: 82px;
        height: 82px;
      }


      .status {
        font-size: 10px;
        margin-top: 11px;
      }


      main {
        max-width: 1120px;

        width: 100%;

        margin: 0 auto;

        padding:
          70px 0
          80px;
      }


      h1 {
        font-size:
          clamp(
            90px,
            11vw,
            155px
          );
      }


      .copy {
        font-size: 16px;

        max-width: 500px;

        margin-top: 35px;
      }


      .bottom {
        max-width: 1120px;

        width: 100%;

        margin: 0 auto;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 360px) {

      .page {
        padding:
          max(18px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }


      .logo {
        width: 62px;
        height: 62px;
      }


      .status {
        font-size: 7px;
      }


      main {
        padding:
          45px 0
          40px;
      }


      h1 {
        font-size: 17vw;
      }


      .copy {
        margin-top: 23px;

        font-size: 13px;
      }

    }


    /* =====================================================
       LANDSCAPE MOBILE
    ===================================================== */

    @media (max-height: 620px) and (orientation: landscape) {

      .page {
        padding-top: 15px;
        padding-bottom: 15px;
      }


      .logo {
        width: 46px;
        height: 46px;
      }


      .status {
        margin-top: 5px;
      }


      main {
        padding:
          25px 0
          25px;
      }


      .kicker {
        margin-bottom: 10px;
      }


      h1 {
        font-size: 11vw;
      }


      .copy {
        margin-top: 16px;

        font-size: 12px;

        max-width: 520px;

        line-height: 1.45;
      }


      .rule {
        margin-bottom: 10px;
      }

    }


    /* =====================================================
       MOTION
    ===================================================== */

    @keyframes enterTop {

      from {
        opacity: 0;

        transform:
          translateY(-14px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    @keyframes fadeUp {

      from {
        opacity: 0;

        transform:
          translateY(16px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    @keyframes titleReveal {

      from {
        opacity: 0;

        transform:
          translateY(35px);

        clip-path:
          inset(100% 0 0 0);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);

        clip-path:
          inset(0 0 0 0);
      }

    }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

    }

  </style>
</head>


<body>


  <!-- BACKGROUND -->

  <div class="background">

    <div class="glow"></div>

    <div class="grain"></div>

  </div>



  <!-- PAGE -->

  <div class="page">


    <!-- HEADER -->

    <header>

      <a
        href="https://koolcid424.github.io/pedalpast/"
        aria-label="PedalPast"
      >

        <img
          class="logo"
          src="https://i.ibb.co/PvZWWyRx/transparent-logo.png"
          alt="PedalPast"
        >

      </a>


      <div class="status">

        <span class="status-dot"></span>

        Website in progress

      </div>

    </header>



    <!-- HERO -->

    <main>

      <section class="hero">


        <div class="kicker">

          <span class="kicker-line"></span>

          PEDALPAST / 2026

        </div>


        <h1>

          <span class="solid">
            Under
          </span>

          <span class="outline">
            Development
          </span>

        </h1>


        <p class="copy">

          We’re building something worth
          <strong>getting on your bike for.</strong>

          The new PedalPast website is currently
          being put together and will be launching soon.

        </p>


      </section>

    </main>



    <!-- FOOTER -->

    <footer class="bottom">

      <div class="rule"></div>


      <div class="bottom-row">


        <div class="descriptor">

          PRIVATE VINTAGE<br>
          BICYCLE EXPERIENCES

        </div>


        <div class="year">

          EST. 2026

        </div>


      </div>

    </footer>


  </div>


</body>
</html>
