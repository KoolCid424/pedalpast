<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="https://i.ibb.co/PvZWWyRx/transparent-logo.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/PvZWWyRx/transparent-logo.png">

<title>Event Not Found | PedalPast</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --green: #17372d;
    --cream: #f5f0e5;
    --gold: #b99a5b;
    --muted: #697169;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "DM Sans", sans-serif;
    background: var(--cream);
    color: var(--green);
}

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 25px;
}

.content {
    width: 100%;
    max-width: 560px;
    animation: fadeUp .8s ease forwards;
}

.logo {
    width: 115px;
    max-width: 45vw;
    height: auto;
    margin-bottom: 45px;
}

.eyebrow {
    color: var(--gold);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .25em;
    text-transform: uppercase;
    margin-bottom: 18px;
}

h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px, 7vw, 64px);
    line-height: .95;
    font-weight: 500;
    margin-bottom: 20px;
}

.message {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 32px;
}

.home-button {
    display: inline-block;
    padding: 14px 25px;
    background: var(--gold);
    color: white;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    border-radius: 3px;
    transition: .25s ease;
}

.home-button:hover {
    background: #c9aa69;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    .logo {
        width: 90px;
        margin-bottom: 35px;
    }

    .message {
        font-size: 13px;
    }
}
</style>

</head>

<body>

<main class="page">


<div class="content">

    <img
        class="logo"
        src="https://i.ibb.co/PvZWWyRx/transparent-logo.png"
        alt="PedalPast"
    >

    <div class="eyebrow">
        PedalPast
    </div>

    <h1>Event Not Found</h1>

    <p class="message">
        Event identifier not found.
        The event you're looking for may no longer exist or the link may be incorrect.
    </p>

    <a
        href="https://koolcid424.github.io/pedalpast/"
        class="home-button"
    >
        Return Home
    </a>

</div>


</main>

</body>
</html>
